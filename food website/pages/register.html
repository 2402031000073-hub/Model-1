<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register - FoodHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
   
    <header>
        <div class="header-container">
            <a href="home.html" class="logo">🍽️ FoodHub</a>
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="category.html">Categories</a></li>
                    <li><a href="product.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <a href="cart.html" class="nav-icon" title="Cart">🛒</a>
                <div class="user-auth">
                    <a href="login.html" class="btn-login">Login</a>
                    <a href="register.html" class="btn-register">Register</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 style="text-align: center; margin: 2rem 0;">Create Your Account</h1>
        
        <form id="registerForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <div class="form-group">
                <label for="confirm-password">Confirm Password</label>
                <input type="password" id="confirm-password" name="confirm-password" required>
            </div>

            <div class="form-group">
                <button type="submit" class="btn btn-primary" style="width: 100%;">Register</button>
            </div>

            <p style="text-align: center;">Already have an account? <a href="login.html" style="color: var(--primary-color); text-decoration: none;">Login here</a></p>
        </form>
    </div>

    <footer></footer>

    <script src="../js/script.js"></script>
    <script>
        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const name = document.getElementById('name').value;
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirm-password').value;

            if (password !== confirmPassword) {
                foodWebsite.showNotification('Passwords do not match', 'danger');
                return;
            }

            const result = foodWebsite.registerUser(email, password, name);
            if (result.success) {
                foodWebsite.showNotification(result.message, 'success');
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 1000);
            } else {
                foodWebsite.showNotification(result.message, 'danger');
            }
        });
    </script>
</body>
</html>
