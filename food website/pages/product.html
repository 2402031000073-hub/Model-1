<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products - FoodHub</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body>
    <header>
        <div class="header-container">
            <a href="home.html" class="logo">🍽️ FoodHub</a>
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="category.html">Categories</a></li>
                    <li><a href="product.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="faq.html">FAQ</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <a href="cart.html" class="nav-icon" title="Cart">🛒</a>
                <div class="user-auth">
                    <a href="login.html" class="btn-login">Login</a>
                    <a href="register.html" class="btn-register">Register</a>
                </div>
            </div>
        </div>
    </header>

    <div class="container">
        <h1 style="text-align: center; margin: 2rem 0;">Our Products</h1>
        
        <div style="text-align: center; margin-bottom: 2rem;">
            <input type="text" id="searchInput" placeholder="Search products..." style="padding: 0.75rem; width: 100%; max-width: 400px; border: 1px solid var(--border-color); border-radius: 4px;">
        </div>

        <div class="products-grid" id="all-products"></div>
        <div class="load-more-container">
            <button id="loadMoreBtn" class="btn btn-primary">Load More Products</button>
        </div>
    </div>

    
    <footer></footer>

    <script src="../js/script.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const allProducts = document.getElementById('all-products');
        const loadMoreBtn = document.getElementById('loadMoreBtn');
        const searchInput = document.getElementById('searchInput');

        let visibleCount = 6;
        let filteredProducts = [...foodWebsite.products];

        function displayProducts(products) {
            allProducts.innerHTML = '';
            if (products.length === 0) {
                allProducts.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No products found.</p>';
                return;
            }

            products.forEach(product => {
                const productCard = document.createElement('div');
                productCard.className = 'product-card';
                productCard.innerHTML = `
                    <div class="product-image">
                        <img src="${product.image}" alt="${product.name}" style="width:100%; height:100%; object-fit: cover; border-radius: 8px;">
                    </div>
                    <div class="product-info">
                        <div class="product-name">${product.name}</div>
                        <div class="product-description">${product.description}</div>
                        <div class="product-rating">⭐ ${product.rating} Rating</div>
                        <div class="product-price">$${product.price.toFixed(2)}</div>
                        <div class="price-difference">Size: Small base, Medium +$1.50, Large +$3.00</div>
                        <div class="product-card-size-row">
                            <label><input type="radio" name="size-option-${product.id}" value="Small" checked> Small</label>
                            <label><input type="radio" name="size-option-${product.id}" value="Medium"> Medium</label>
                            <label><input type="radio" name="size-option-${product.id}" value="Large"> Large</label>
                        </div>
                        <div class="product-actions" style="display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: center;">
                            <input type="number" id="qty-${product.id}" class="qty-input" value="1" min="1" style="width: 80px;">
                            <button class="btn btn-primary" onclick="addProductToCart(${product.id})">Add to Cart</button>
                            <a href="product-details.html?id=${product.id}" class="btn btn-secondary">View</a>
                        </div>
                    </div>
                `;
                allProducts.appendChild(productCard);
            });
        }

        function renderProducts() {
            const productsToDisplay = filteredProducts.slice(0, visibleCount);
            displayProducts(productsToDisplay);
            loadMoreBtn.style.display = visibleCount < filteredProducts.length ? 'inline-flex' : 'none';
        }

        function addProductToCart(productId) {
            const quantityInput = document.getElementById('qty-' + productId);
            const qty = Math.max(1, parseInt(quantityInput?.value) || 1);
            const selectedSize = document.querySelector(`input[name="size-option-${productId}"]:checked`);
            const size = selectedSize?.value || 'Small';
            foodWebsite.addToCart(productId, qty, { size });
            if (quantityInput) {
                quantityInput.value = 1;
            }
        }

        function loadMoreProducts() {
            visibleCount += 6;
            renderProducts();
        }

        loadMoreBtn.addEventListener('click', loadMoreProducts);

        searchInput.addEventListener('keyup', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            filteredProducts = foodWebsite.products.filter(product => 
                product.name.toLowerCase().includes(searchTerm) ||
                product.description.toLowerCase().includes(searchTerm)
            );
            visibleCount = 6;
            renderProducts();
        });

        renderProducts();
    </script>
</body>
</html>
