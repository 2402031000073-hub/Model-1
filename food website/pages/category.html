<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Categories - FoodHub</title>
    <link rel="stylesheet" href="../css/style.css">
</head>
<body>
    
    <header>
        <div class="header-container">
            <a href="home.html" class="logo">🍽️ FoodHub</a>
            <nav>
                <ul>
                    <li><a href="home.html">Home</a></li>
                    <li><a href="category.html">Categories</a></li>
                    <li><a href="product.html">Products</a></li>
                    <li><a href="about.html">About</a></li>
                    <li><a href="contact.html">Contact</a></li>
                </ul>
            </nav>
            <div class="nav-icons">
                <a href="cart.html" class="nav-icon" title="Cart">🛒</a>
                <div class="user-auth">
                    <a href="login.html" class="btn-login">Login</a>
                    <a href="register.html" class="btn-register">Register</a>
                </div>
            </div>
        </div>
    </header>

   
    <div class="container">
        <h1 style="text-align: center; margin: 2rem 0;">Browse Our Categories</h1>
        
        <div class="category-list" id="all-categories"></div>

        <h2 style="text-align: center; margin: 3rem 0;">Products in this Category</h2>
        
        <!-- Filter and Sort Section -->
        <div class="filter-sort-section">
            <div class="filter-container">
                <h3>🔍 Filter</h3>
                <div class="filter-group">
                    <label for="price-min">Min Price: $<span id="min-price-display">0</span></label>
                    <input type="range" id="price-min" min="0" max="15" value="0" step="0.5">
                </div>
                <div class="filter-group">
                    <label for="price-max">Max Price: $<span id="max-price-display">15</span></label>
                    <input type="range" id="price-max" min="0" max="15" value="15" step="0.5">
                </div>
                <div class="filter-group">
                    <label for="rating-filter">Minimum Rating:</label>
                    <select id="rating-filter">
                        <option value="0">All Ratings</option>
                        <option value="3">⭐ 3+</option>
                        <option value="4">⭐ 4+</option>
                        <option value="4.5">⭐ 4.5+</option>
                    </select>
                </div>
                <button class="btn btn-secondary" onclick="resetFilters()">Reset Filters</button>
            </div>

            <div class="sort-container">
                <h3>📊 Sort</h3>
                <div class="sort-group">
                    <label for="sort-option">Sort By:</label>
                    <select id="sort-option">
                        <option value="default">Default</option>
                        <option value="price-low">Price: Low to High</option>
                        <option value="price-high">Price: High to Low</option>
                        <option value="rating-high">Rating: High to Low</option>
                        <option value="rating-low">Rating: Low to High</option>
                    </select>
                </div>
            </div>
        </div>

        <div class="option-builder" style="margin: 2rem 0;">
            <h3>Add Custom Radio / Checkbox Options</h3>
            <div class="option-builder-form">
                <input type="text" id="option-text" placeholder="Enter option label" aria-label="Option label" />
                <select id="option-type" aria-label="Option type">
                    <option value="radio">Radio</option>
                    <option value="checkbox">Checkbox</option>
                </select>
                <button id="add-option-btn" class="btn btn-primary">Add Option</button>
            </div>
            <div class="option-groups">
                <div class="option-group-card">
                    <h3>Radio Options</h3>
                    <div id="radio-options" class="option-group"></div>
                </div>
                <div class="option-group-card">
                    <h3>Checkbox Options</h3>
                    <div id="checkbox-options" class="option-group"></div>
                </div>
            </div>
        </div>

        <div class="products-grid" id="category-products"></div>
    </div>

    
    <footer></footer>

    <script src="../js/script.js"></script>
    <script>
       
        const urlParams = new URLSearchParams(window.location.search);
        const categoryId = parseInt(urlParams.get('id')) || null;

        
        const allCategories = document.getElementById('all-categories');
        foodWebsite.categories.forEach(category => {
            const categoryCard = document.createElement('div');
            categoryCard.className = 'category-card';
            categoryCard.style.cursor = 'pointer';
            categoryCard.innerHTML = `
                <div class="category-icon">${category.icon}</div>
                <div class="category-name">${category.name}</div>
            `;
            categoryCard.addEventListener('click', () => {
                window.location.href = `category.html?id=${category.id}`;
            });
            allCategories.appendChild(categoryCard);
        });

        
        const categoryProducts = document.getElementById('category-products');
        let productsInCategory = categoryId 
            ? foodWebsite.products.filter(p => p.category === categoryId)
            : foodWebsite.products;

        const categoryName = foodWebsite.categories.find(c => c.id === categoryId)?.name || 'All Products';
        if (categoryId) {
            const categoryTitle = document.querySelector('h2');
            categoryTitle.textContent = `${categoryName} Products`;
        }

        // Display products function
        function displayProducts(products) {
            categoryProducts.innerHTML = '';
            if (products.length === 0) {
                categoryProducts.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No products found matching your filters.</p>';
            } else {
                products.forEach(product => {
                    const productCard = document.createElement('div');
                    productCard.className = 'product-card';
                    productCard.innerHTML = `
                        <div class="product-image">
                            <img src="${product.image}" alt="${product.name}" style="width: 100%; height: 100%; object-fit: cover; border-radius: 8px;">
                        </div>
                        <div class="product-info">
                            <div class="product-name">${product.name}</div>
                            <div class="product-description">${product.description}</div>
                            <div class="product-rating">⭐ ${product.rating} Rating</div>
                            <div class="product-price">$${product.price.toFixed(2)}</div>
                            <div class="price-difference">Size: Small base, Medium +$1.50, Large +$3.00</div>
                            <div class="product-card-size-row">
                                <label><input type="radio" name="size-option-${product.id}" value="Small" checked> Small</label>
                                <label><input type="radio" name="size-option-${product.id}" value="Medium"> Medium</label>
                                <label><input type="radio" name="size-option-${product.id}" value="Large"> Large</label>
                            </div>
                            <div class="product-actions">
                                <button class="btn btn-primary" onclick="addProductToCart(${product.id}); return false;">Add to Cart</button>
                                <a href="product-details.html?id=${product.id}" class="btn btn-secondary">View</a>
                            </div>
                        </div>
                    `;
                    categoryProducts.appendChild(productCard);
                });
            }
        }

        function addProductToCart(productId) {
            const selectedSize = document.querySelector(`input[name="size-option-${productId}"]:checked`);
            const size = selectedSize?.value || 'Small';
            foodWebsite.addToCart(productId, 1, { size });
        }

        // Filter and sort logic
        function applyFiltersAndSort() {
            let filtered = [...productsInCategory];

            // Apply price filter
            const minPrice = parseFloat(document.getElementById('price-min').value);
            const maxPrice = parseFloat(document.getElementById('price-max').value);
            filtered = filtered.filter(p => p.price >= minPrice && p.price <= maxPrice);

            // Apply rating filter
            const minRating = parseFloat(document.getElementById('rating-filter').value);
            if (minRating > 0) {
                filtered = filtered.filter(p => p.rating >= minRating);
            }

            // Apply sorting
            const sortOption = document.getElementById('sort-option').value;
            switch(sortOption) {
                case 'price-low':
                    filtered.sort((a, b) => a.price - b.price);
                    break;
                case 'price-high':
                    filtered.sort((a, b) => b.price - a.price);
                    break;
                case 'rating-high':
                    filtered.sort((a, b) => b.rating - a.rating);
                    break;
                case 'rating-low':
                    filtered.sort((a, b) => a.rating - b.rating);
                    break;
                default:
                    break;
            }

            displayProducts(filtered);
        }

        // Reset filters function
        function resetFilters() {
            document.getElementById('price-min').value = 0;
            document.getElementById('price-max').value = 15;
            document.getElementById('rating-filter').value = 0;
            document.getElementById('sort-option').value = 'default';
            document.getElementById('min-price-display').textContent = '0';
            document.getElementById('max-price-display').textContent = '15';
            displayProducts(productsInCategory);
        }

        // Add event listeners
        document.getElementById('price-min').addEventListener('input', (e) => {
            document.getElementById('min-price-display').textContent = e.target.value;
            applyFiltersAndSort();
        });

        document.getElementById('price-max').addEventListener('input', (e) => {
            document.getElementById('max-price-display').textContent = e.target.value;
            applyFiltersAndSort();
        });

        document.getElementById('rating-filter').addEventListener('change', applyFiltersAndSort);
        document.getElementById('sort-option').addEventListener('change', applyFiltersAndSort);

        // Initial display
        displayProducts(productsInCategory);
    </script>
</body>
</html>
